# 推送 tag（如 v1.0.0）→ 云端打包 → 自动创建 GitHub Release 并附上 zip + dmg
#
# 使用方式：
#   git tag v1.0.0
#   git push origin v1.0.0

name: Tag 发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Release 构建
        run: |
          set -eo pipefail
          xcodebuild \
            -project HabitCredits.xcodeproj \
            -scheme HabitCredits \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打 zip 与 dmg
        run: |
          set -eo pipefail
          mkdir -p dist
          APP="build/DerivedData/Build/Products/Release/HabitCredits.app"
          test -d "$APP"
          cp -R "$APP" dist/
          cd dist
          ditto -c -k --sequesterRsrc --keepParent HabitCredits.app HabitCredits-macOS.zip
          hdiutil create -volname "HabitCredits" -srcfolder "HabitCredits.app" -ov -format UDZO "HabitCredits.dmg"

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HabitCredits-macOS.zip
            dist/HabitCredits.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
